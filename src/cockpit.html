<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>CLOUDROOM // SCRYING COCKPIT & DIFF THEATER V2</title>
<style>
  :root {
    --bg: #090806;
    --panel: #13100c;
    --card-bg: rgba(23, 19, 14, 0.75);
    --border: rgba(212, 168, 83, 0.25);
    --border-glow: rgba(212, 168, 83, 0.4);
    --text: #f7f1e5;
    --muted: #a3957d;
    --gold: #e5b85c;
    --gold-glow: #ffcf70;
    --crimson: #d94333;
    --teal: #42bebd;
    --purple: #a855f7;
    --glow: rgba(229, 184, 92, 0.22);
    --font: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    --glass-blur: blur(12px);
  }
  body.blegh {
    --bg: #060102;
    --panel: #120305;
    --card-bg: rgba(24, 4, 8, 0.82);
    --border: rgba(255, 42, 75, 0.35);
    --border-glow: rgba(255, 42, 75, 0.6);
    --text: #ffeef0;
    --muted: #c27680;
    --gold: #ff2a4b;
    --gold-glow: #ff5c75;
    --crimson: #ff002b;
    --teal: #ff6a00;
    --purple: #d946ef;
    --glow: rgba(255, 0, 43, 0.42);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.3s ease, color 0.3s ease;
    background-image:
      radial-gradient(circle at 15% 15%, rgba(229, 184, 92, 0.05) 0%, transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(66, 190, 189, 0.05) 0%, transparent 40%);
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 20px;
    background: rgba(19, 16, 12, 0.85);
    backdrop-filter: var(--glass-blur);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 4px 20px var(--glow);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: var(--gold);
    text-transform: uppercase;
    font-size: 14px;
    text-shadow: 0 0 10px var(--glow);
  }
  .brand-logo {
    width: 24px;
    height: 24px;
    background: linear-gradient(135deg, var(--gold), var(--teal));
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #000;
    font-weight: 900;
    font-size: 12px;
    box-shadow: 0 0 12px var(--glow);
  }

  .badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.4);
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .top-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }

  input[type="password"], input[type="text"] {
    background: rgba(0,0,0,0.6);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 12px;
    outline: none;
    transition: all 0.2s;
  }
  input[type="password"]:focus, input[type="text"]:focus {
    border-color: var(--gold);
    box-shadow: 0 0 8px var(--glow);
  }

  button {
    background: rgba(30, 25, 20, 0.8);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  button:hover {
    background: var(--gold);
    color: #000;
    border-color: var(--gold-glow);
    box-shadow: 0 0 12px var(--glow);
    transform: translateY(-1px);
  }
  button.active {
    background: var(--gold);
    color: #000;
    border-color: var(--gold-glow);
    box-shadow: 0 0 14px var(--glow);
  }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr 300px;
    gap: 16px;
    padding: 16px;
    max-width: 1700px;
    margin: 0 auto;
  }

  @media (max-width: 1150px) {
    .layout {
      grid-template-columns: 1fr;
    }
  }

  .card {
    background: var(--card-bg);
    backdrop-filter: var(--glass-blur);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.37);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .card:hover {
    border-color: var(--border-glow);
  }

  .card-header {
    padding: 12px 16px;
    background: rgba(0,0,0,0.3);
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--gold);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-body {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1;
  }

  /* Scrying Ring Joystick */
  .scry-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: rgba(0,0,0,0.25);
    border-radius: 10px;
    border: 1px dashed var(--border);
  }
  .scry-ring {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    position: relative;
    background: radial-gradient(circle, rgba(229,184,92,0.1) 0%, rgba(0,0,0,0.6) 80%);
    box-shadow: inset 0 0 20px var(--glow), 0 0 15px var(--glow);
    touch-action: none;
    cursor: grab;
  }
  .scry-ring:active { cursor: grabbing; }
  .scry-pip {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--gold);
    position: absolute;
    top: 59px;
    left: 59px;
    box-shadow: 0 0 12px var(--gold-glow);
    pointer-events: none;
    transition: transform 0.05s linear;
  }

  .session-item {
    padding: 10px 12px;
    border-radius: 8px;
    background: rgba(0,0,0,0.3);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .session-item:hover {
    border-color: var(--border);
    background: rgba(229, 184, 92, 0.08);
  }
  .session-item.active {
    border-color: var(--gold);
    background: rgba(229, 184, 92, 0.15);
    box-shadow: 0 0 12px var(--glow);
  }

  /* Main Stream & Theater */
  .stream-box {
    background: #040302;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-family: var(--font);
    font-size: 12px;
    line-height: 1.5;
    color: var(--text);
    height: 480px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.8);
  }

  .prompt-bar {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .prompt-bar input {
    flex: 1;
  }

  .quick-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .quick-btn {
    padding: 4px 8px;
    font-size: 11px;
    background: rgba(255,255,255,0.05);
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 11px;
  }
  .stat-row span:first-child { color: var(--muted); }
  .stat-row span:last-child { color: var(--gold); font-weight: 600; }

  .kersplode {
    animation: kersplodeAnim 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes kersplodeAnim {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); filter: brightness(1.4); }
    100% { transform: scale(1); }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo">CR</div>
    <span>Cloudroom // Scrying Cockpit & Diff Theater</span>
  </div>
  <div class="top-controls">
    <div id="health-badge" class="badge" style="color: var(--gold);">CONNECTING...</div>
    <input type="password" id="token-input" placeholder="CLOUDROOM_TOKEN..." onchange="saveToken()" />
    <button onclick="saveToken()">🔐 Save Link</button>
    <button id="mouth-btn" onclick="toggleMouthTape()">👄 MOUTHTAPE: OFF</button>
    <button id="gyro-btn" onclick="enableGyro()">🌀 GYRO TILT</button>
    <button onclick="toggleBlegh()">🔥 BLEGH MODE</button>
  </div>
</header>

<div class="layout">
  <!-- LEFT RAIL: Scrying Ring & Harness Matrix -->
  <div class="card">
    <div class="card-header">
      <span>1. Scrying Control & Spawn</span>
    </div>
    <div class="card-body">
      <div class="scry-wrapper">
        <div class="scry-ring" id="scrying-ring">
          <div class="scry-pip" id="scrying-pip"></div>
        </div>
        <div style="font-size:11px;color:var(--muted);text-align:center;">
          SECTOR: <span id="scry-sector" style="color:var(--gold);font-weight:700;">CENTER</span>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px;">
        <label style="font-size:11px;color:var(--muted);font-weight:700;">SPAWN HARNESS</label>
        <div style="display:flex;gap:6px;">
          <select id="harness-select" style="flex:1;background:rgba(0,0,0,0.5);border:1px solid var(--border);color:var(--text);padding:6px;border-radius:6px;font-family:inherit;">
            <option value="codex">Codex Harness</option>
            <option value="claude">Claude Code</option>
            <option value="pi">Pi Harness</option>
            <option value="opencode">OpenCode</option>
          </select>
          <button onclick="spawnSession()">+ Spawn</button>
        </div>
      </div>

      <div style="margin-top:12px;display:flex;flex-direction:column;gap:6px;">
        <div style="font-size:11px;color:var(--muted);font-weight:700;">ACTIVE AGENT SESSIONS</div>
        <div id="sessions-list" style="display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;">
          <!-- Loaded dynamically -->
        </div>
      </div>
    </div>
  </div>

  <!-- CENTER: Diff Theater & Realtime Agent Stream -->
  <div class="card" id="center-card">
    <div class="card-header">
      <span id="pane-title">2. Diff Theater & Agent Stream</span>
      <div style="display:flex;gap:6px;">
        <button id="btn-stream" class="active" onclick="setPane('stream')">Stream / Diff</button>
        <button id="btn-terminal" onclick="setPane('terminal')">PTY Terminal</button>
      </div>
    </div>
    <div class="card-body">
      <div class="quick-actions">
        <button class="quick-btn" onclick="quickPrompt('git status')">⚡ git status</button>
        <button class="quick-btn" onclick="quickPrompt('git diff')">⚡ git diff</button>
        <button class="quick-btn" onclick="quickPrompt('cargo check')">⚡ cargo check</button>
        <button class="quick-btn" onclick="quickPrompt('cargo test')">⚡ cargo test</button>
      </div>

      <div id="stream-box" class="stream-box">Initializing Scrying Cockpit telemetry connection...</div>

      <div class="prompt-bar">
        <input id="prompt-input" placeholder="Send prompt to active agent session..." onkeydown="if(event.key==='Enter')sendAction()" />
        <button onclick="sendAction()">Transmit ▶</button>
      </div>
    </div>
  </div>

  <!-- RIGHT RAIL: Storage Guard, Capabilities & Telemetry -->
  <div class="card">
    <div class="card-header">
      <span>3. Guard & Host Telemetry</span>
      <span id="storage-level" class="badge">NORMAL</span>
    </div>
    <div class="card-body">
      <div id="telemetry-stats"></div>
      <div class="card-header" style="margin:12px -16px 8px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);border-radius:0;">
        <span>🪞 Capabilities Matrix</span>
      </div>
      <div id="caps-list" style="font-size:11px;color:var(--muted);line-height:1.6;"></div>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
if (params.get('token')) {
  localStorage.setItem('cloudroom_token', params.get('token'));
  history.replaceState({}, '', location.pathname);
}
document.getElementById('token-input').value = localStorage.getItem('cloudroom_token') || '';

let currentSession = null;
let currentPane = 'stream';
let mouthTape = false;
let blegh = false;
let audioCtx = null;

function token() {
  return document.getElementById('token-input').value.trim();
}
function saveToken() {
  localStorage.setItem('cloudroom_token', token());
  refreshAll();
}
async function api(path, opts = {}) {
  const headers = Object.assign({ 'Authorization': 'Bearer ' + token() }, opts.headers || {});
  if (opts.body && typeof opts.body === 'object') {
    headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  const text = await res.text();
  let data = null;
  try { data = JSON.parse(text); } catch (_) { data = { raw: text }; }
  if (!res.ok) throw new Error((data && (data.message || data.error)) || res.statusText);
  return data;
}

function thallHit(freq = 42) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = blegh ? 'sawtooth' : 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.29);
  } catch (_) {}
}

function mouthSpeak(text) {
  if (!mouthTape || !text) return;
  thallHit(blegh ? 55 : 140);
  if ('speechSynthesis' in window) {
    const u = new SpeechSynthesisUtterance(String(text).slice(0, 220));
    u.pitch = blegh ? 0.4 : 0.9;
    u.rate = 1.15;
    window.speechSynthesis.speak(u);
  }
}

function toggleBlegh() {
  blegh = !blegh;
  document.body.classList.toggle('blegh', blegh);
  document.getElementById('center-card').classList.add('kersplode');
  setTimeout(() => document.getElementById('center-card').classList.remove('kersplode'), 350);
  thallHit(blegh ? 42 : 110);
}

function toggleMouthTape() {
  mouthTape = !mouthTape;
  const btn = document.getElementById('mouth-btn');
  btn.textContent = '👄 MOUTHTAPE: ' + (mouthTape ? 'ON' : 'OFF');
  btn.classList.toggle('active', mouthTape);
  if (mouthTape) mouthSpeak('MouthTape formant synthesizer online.');
}

function setPane(p) {
  currentPane = p;
  document.getElementById('btn-stream').classList.toggle('active', p === 'stream');
  document.getElementById('btn-terminal').classList.toggle('active', p === 'terminal');
  document.getElementById('pane-title').textContent = p === 'stream'
    ? '2. Diff Theater & Agent Stream'
    : '2. Interactive Session Stream';
}

async function refreshAll() {
  try {
    const [ready, caps, dash, sessions] = await Promise.all([
      api('/v1/ready'),
      api('/v1/capabilities'),
      api('/v1/dashboard').catch(() => ({})),
      api('/v1/sessions').catch(() => ({ sessions: [] }))
    ]);
    const hb = document.getElementById('health-badge');
    hb.textContent = ready.ready ? 'CORE READY' : ('DEGRADED: ' + (ready.reason || 'check'));
    hb.style.borderColor = ready.ready ? '#42bebd' : '#ff5f5f';
    hb.style.color = ready.ready ? '#42bebd' : '#ff5f5f';

    const st = ready.storage || {};
    document.getElementById('storage-level').textContent = (st.level || 'normal').toUpperCase();
    const availMb = st.workspace_available_bytes ? Math.round(st.workspace_available_bytes / 1048576) + ' MB' : 'n/a';
    const totalMb = st.workspace_total_bytes ? Math.round(st.workspace_total_bytes / 1048576) + ' MB' : 'n/a';
    const harnesses = Object.keys(ready.harnesses || {}).join(', ') || 'none configured';
    document.getElementById('telemetry-stats').innerHTML = `
      <div class="stat-row"><span>Version</span><span>${caps.version || ''} (${caps.commit || ''})</span></div>
      <div class="stat-row"><span>Disk Free</span><span>${availMb} / ${totalMb}</span></div>
      <div class="stat-row"><span>Guard Reason</span><span>${st.reason || 'ok'}</span></div>
      <div class="stat-row"><span>Harnesses</span><span>${harnesses}</span></div>
      <div class="stat-row"><span>Active Sessions</span><span>${(sessions.sessions || []).length}</span></div>
    `;
    document.getElementById('caps-list').textContent = (caps.features || []).join(' · ');

    const list = sessions.sessions || [];
    const container = document.getElementById('sessions-list');
    container.innerHTML = list.length ? '' : '<div style="color:var(--muted);font-size:11px;">No sessions yet. Click + Spawn above.</div>';
    list.forEach((s) => {
      const div = document.createElement('div');
      div.className = 'session-item' + (currentSession === s.id ? ' active' : '');
      div.innerHTML = `<div style="font-weight:700;color:var(--gold)">${s.id.slice(0, 12)}</div>
        <div style="font-size:11px;color:var(--muted)">${s.harness || ''} · ${s.state || s.status || 'active'}</div>`;
      div.onclick = () => selectSession(s.id);
      container.appendChild(div);
    });
  } catch (err) {
    document.getElementById('health-badge').textContent = 'AUTH / LINK NEEDED';
    document.getElementById('health-badge').style.borderColor = '#ff5f5f';
    document.getElementById('health-badge').style.color = '#ff5f5f';
    document.getElementById('stream-box').textContent = 'Link your CLOUDROOM_TOKEN above.\nError: ' + err.message;
  }
}

async function selectSession(id) {
  currentSession = id;
  refreshAll();
  try {
    const ev = await api(`/v1/sessions/${id}/events`);
    const lines = (ev.events || []).map(e => `[${e.kind || e.type || 'event'}] ${JSON.stringify(e.data || e)}`).join('\n');
    document.getElementById('stream-box').textContent = lines || `Session ${id} attached. Ready for prompts.`;
  } catch (err) {
    document.getElementById('stream-box').textContent = `Session ${id}: ${err.message}`;
  }
}

async function spawnSession() {
  const harness = document.getElementById('harness-select').value;
  const reqId = 'req-' + Date.now();
  try {
    const res = await api('/v1/sessions', {
      method: 'POST',
      body: { request_id: reqId, harness }
    });
    thallHit(88);
    currentSession = res.session_id || res.id;
    await refreshAll();
    if (currentSession) selectSession(currentSession);
  } catch (err) {
    document.getElementById('stream-box').textContent = 'Spawn error: ' + err.message;
  }
}

function quickPrompt(text) {
  document.getElementById('prompt-input').value = text;
  sendAction();
}

async function sendAction() {
  const input = document.getElementById('prompt-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  if (!currentSession) {
    document.getElementById('stream-box').textContent = 'Spawn or select a session first.';
    return;
  }
  try {
    const reqId = 'prompt-' + Date.now();
    await api(`/v1/sessions/${currentSession}/prompts`, {
      method: 'POST',
      body: { request_id: reqId, text }
    });
    mouthSpeak('Transmitted: ' + text);
    setTimeout(() => selectSession(currentSession), 600);
  } catch (err) {
    document.getElementById('stream-box').textContent += '\n[Error] ' + err.message;
  }
}

// Scrying Ring / Thumbstick
const ring = document.getElementById('scrying-ring');
const pip = document.getElementById('scrying-pip');
let dragging = false;
function updatePip(dx, dy) {
  const max = 48;
  const dist = Math.hypot(dx, dy);
  if (dist > max) { dx = (dx / dist) * max; dy = (dy / dist) * max; }
  pip.style.left = (59 + dx) + 'px';
  pip.style.top = (59 + dy) + 'px';
  let sector = 'CENTER';
  if (Math.hypot(dx, dy) > 20) {
    if (Math.abs(dx) > Math.abs(dy)) sector = dx > 0 ? 'NEXT' : 'PREV';
    else sector = dy > 0 ? 'TERMINAL' : 'STREAM';
  }
  document.getElementById('scry-sector').textContent = sector;
  if (sector === 'STREAM') setPane('stream');
  if (sector === 'TERMINAL') setPane('terminal');
}
ring.addEventListener('pointerdown', (e) => { dragging = true; ring.setPointerCapture(e.pointerId); });
ring.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const r = ring.getBoundingClientRect();
  updatePip(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
});
ring.addEventListener('pointerup', () => { dragging = false; updatePip(0, 0); });

function enableGyro() {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(state => {
      if (state === 'granted') attachGyro();
    });
  } else {
    attachGyro();
  }
}
function attachGyro() {
  document.getElementById('gyro-btn').classList.add('active');
  window.addEventListener('deviceorientation', (e) => {
    const dx = Math.max(-48, Math.min(48, (e.gamma || 0) * 1.8));
    const dy = Math.max(-48, Math.min(48, ((e.beta || 0) - 35) * 1.8));
    updatePip(dx, dy);
  });
}

refreshAll();
setInterval(refreshAll, 5000);
</script>
</body>
</html>
